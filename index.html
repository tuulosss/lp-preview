<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>LP Preview</title>
<style>
  /* Spotify-ish: always dark, green accent, pill buttons, one colour per action. */
  :root { color-scheme: dark; --bg:#121212; --fg:#fff; --muted:#b3b3b3; --card:#1f1f1f; --hover:#2a2a2a; --accent:#1ed760;
    --blue:#509bf5; --purple:#b49bc8; --orange:#ffa42b; --pink:#f573a0; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 "Circular Std", -apple-system, "Helvetica Neue", system-ui, sans-serif; -webkit-tap-highlight-color:transparent; }
  main { max-width:640px; margin:0 auto; padding:0 16px calc(16px + env(safe-area-inset-bottom)); }
  /* Search stays reachable while scrolling the tracklist. */
  form { display:flex; gap:8px; position:sticky; top:0; z-index:1; background:rgb(18 18 18 / .92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); padding:calc(12px + env(safe-area-inset-top)) 0 12px; }
  input { flex:1; min-width:0; font-size:17px; padding:12px 18px; border-radius:500px; border:2px solid transparent; background:var(--card); color:var(--fg); outline:none; transition:border-color .15s, background .15s; }
  input:hover { background:var(--hover); } input:focus { border-color:var(--fg); }
  input::placeholder { color:var(--muted); }
  button, #pick { font:inherit; font-size:15px; font-weight:700; padding:0 18px; border:0; border-radius:500px; background:var(--accent); color:#000; cursor:pointer; transition:transform .1s, filter .15s; }
  button:hover, #pick:hover { transform:scale(1.04); filter:brightness(1.1); }
  button:active, #pick:active { transform:scale(.97); }
  button:disabled { opacity:.6; transform:none; cursor:default; }
  #scan, #savedBtn, #pick { font-size:20px; padding:0 13px; min-width:46px; }
  #scan { background:var(--blue); }
  #pick { display:flex; align-items:center; justify-content:center; background:var(--purple); }
  #savedBtn { background:var(--orange); }
  #savedBtn span { font-size:13px; margin-left:2px; }
  .hits { display:flex; gap:10px; overflow-x:auto; margin:12px 0; }
  .hits { scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:3px; }
  .hits img { width:76px; height:76px; flex:none; scroll-snap-align:start; border-radius:6px; cursor:pointer; opacity:.5; transition:opacity .15s; box-shadow:0 4px 12px rgb(0 0 0 / .5); }
  .hits img:hover { opacity:.85; }
  .hits img.on { opacity:1; outline:3px solid var(--accent); outline-offset:2px; }
  .head { display:flex; gap:20px; align-items:end; margin:16px 0; padding:20px; border-radius:12px; background:linear-gradient(180deg, #3d3d3d, var(--card)); }
  .head img { width:168px; height:168px; border-radius:6px; box-shadow:0 8px 24px rgb(0 0 0 / .6); }
  .head h2 { margin:0 0 6px; font-size:28px; font-weight:800; letter-spacing:-.02em; line-height:1.15; overflow-wrap:anywhere; }
  .head p { margin:0 0 14px; color:var(--muted); font-size:14px; }
  .acts { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .acts a { color:var(--fg); text-decoration:none; font-size:13px; font-weight:700; padding:7px 14px; border:1px solid #727272; border-radius:500px; transition:border-color .15s, transform .1s; }
  .acts a:hover { border-color:var(--fg); transform:scale(1.04); }
  #save { padding:8px 16px; font-size:14px; background:var(--pink); }
  h2 { font-weight:800; letter-spacing:-.02em; }
  ol { list-style:none; padding:0; margin:0; }
  li { display:flex; align-items:center; gap:14px; padding:12px; user-select:none; border-radius:6px; cursor:pointer; transition:background .1s; }
  li:hover { background:var(--hover); } li.on { background:var(--card); }
  li.on .t, li.on .n { color:var(--accent); font-weight:700; }
  li .n { width:24px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
  li .t { flex:1; } li .d { color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }
  #msg { color:var(--muted); }
  .saved { list-style:none; padding:0; margin:0; }
  .saved img { width:52px; height:52px; border-radius:4px; }
  .saved small { color:var(--muted); }
  .saved a { font-size:20px; text-decoration:none; }
  .saved button { background:none; color:var(--muted); font-size:18px; padding:8px; }
  .saved button:hover { color:var(--fg); }
  #cam { position:fixed; inset:0; z-index:9; background:#000; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:16px; }
  #cam[hidden] { display:none; }
  /* Fixed box: height must not follow the stream size, which changes mid-stream (iOS rotation, 1080p switch). */
  #cam video { width:100%; max-width:640px; height:65vh; object-fit:cover; border-radius:12px; background:#222; }
  #cam button { padding:12px 32px; background:var(--fg); }
  @media (max-width:480px) {
    .head { flex-direction:column; align-items:center; text-align:center; }
    .head img { width:min(70vw, 300px); height:auto; aspect-ratio:1; }
    .acts { justify-content:center; }
  }
</style>
</head>
<body>
<main>
  <form id="f"><input id="q" type="search" enterkeyhint="search" placeholder="Hae levyä…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button type="button" id="scan" aria-label="Skannaa viivakoodi">📷</button><label id="pick" aria-label="Lue viivakoodi kuvasta">🖼️<input id="file" type="file" accept="image/*" hidden></label><button type="button" id="savedBtn" aria-label="Tallennetut levyt">📋<span id="savedN"></span></button><button>Hae</button></form>
  <p id="msg"></p>
  <div class="hits" id="hits"></div>
  <div id="album"></div>
  <audio id="player"></audio>
</main>
<div id="cam" hidden><video id="video" playsinline muted></video><p id="camMsg"></p><button id="camClose">Sulje</button></div>
<script>
// Deezer API has no CORS headers, so JSONP it is. No key, no backend.
let n = 0;
function dz(path) {
  return new Promise((ok, fail) => {
    const cb = 'dz' + n++, s = document.createElement('script');
    window[cb] = d => { delete window[cb]; s.remove(); d.error ? fail(d.error) : ok(d); };
    s.onerror = () => { delete window[cb]; s.remove(); fail('verkkovirhe'); };
    s.src = `https://api.deezer.com${path}${path.includes('?') ? '&' : '?'}output=jsonp&callback=${cb}`;
    document.head.append(s);
  });
}

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const player = $('player');
let tracks = [], cur = -1;

$('f').onsubmit = e => { e.preventDefault(); search($('q').value.trim()); };

// release: exact Discogs release path when we came from a barcode scan.
async function search(q, release) {
  if (!q) return;
  $('q').blur();
  $('msg').textContent = 'Haetaan…'; $('hits').innerHTML = ''; $('album').innerHTML = '';
  try {
    const { data } = await dz(`/search/album?q=${encodeURIComponent(q)}&limit=8`);
    if (!data.length) return $('msg').textContent = 'Ei löytynyt.';
    $('msg').textContent = '';
    $('hits').innerHTML = data.map(a => `<img src="${a.cover_medium}" title="${esc(a.artist.name + ' – ' + a.title)}" data-id="${a.id}">`).join('');
    showAlbum(data[0].id, release);
  } catch (err) { $('msg').textContent = 'Virhe: ' + (err.message || err); }
}

// --- Barcode scan. Native BarcodeDetector on Android Chrome; iOS Safari has none, so ZXing-wasm ponyfill.
const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];
async function detector() {
  if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('ean_13'))
    return new BarcodeDetector({ formats: FORMATS });
  const m = await import('https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/es/ponyfill.js');
  return new m.BarcodeDetector({ formats: FORMATS });
}

let stream = null;
function closeCam() { stream?.getTracks().forEach(t => t.stop()); stream = null; $('video').srcObject = null; $('cam').hidden = true; }
$('camClose').onclick = closeCam;

$('scan').onclick = async () => {
  const video = $('video');
  $('cam').hidden = false; $('camMsg').textContent = 'Käynnistetään kamera…';
  try {
    const [det, s] = await Promise.all([detector(), navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, focusMode: 'continuous' } })]);
    if ($('cam').hidden) return s.getTracks().forEach(t => t.stop()); // closed while starting
    stream = s; video.srcObject = s; await video.play();
    $('camMsg').textContent = 'Osoita takakannen viivakoodia';
    while (stream) {
      const [hit] = await det.detect(video).catch(() => []);
      if (hit) { closeCam(); return lookupBarcode(hit.rawValue); }
      await new Promise(r => setTimeout(r, 150));
    }
  } catch (err) { $('camMsg').textContent = 'Kamera ei käynnistynyt: ' + (err.message || err); }
};

// Barcode from an existing photo (gallery). Both native and ponyfill detectors accept a Blob directly.
$('file').onchange = async e => {
  const file = e.target.files[0]; e.target.value = ''; // allow picking the same photo again
  if (!file) return;
  $('msg').textContent = 'Luetaan viivakoodia kuvasta…'; $('hits').innerHTML = ''; $('album').innerHTML = '';
  try {
    const [hit] = await (await detector()).detect(file);
    hit ? lookupBarcode(hit.rawValue) : $('msg').textContent = 'Kuvasta ei löytynyt viivakoodia. Kokeile tarkempaa tai rajatumpaa kuvaa.';
  } catch (err) { $('msg').textContent = 'Kuvan luku epäonnistui: ' + (err.message || err); }
};

const get = url => fetch(url).then(r => r.json()).catch(() => ({}));

async function lookupBarcode(code) {
  $('msg').textContent = `Viivakoodi ${code}, haetaan…`; $('hits').innerHTML = ''; $('album').innerHTML = '';
  const upc = code.replace(/^0(?=\d{12}$)/, ''); // EAN-13 "0…" == UPC-A
  // Discogs has by far the best vinyl barcode coverage (no token needed, CORS ok) and gives the exact pressing.
  const hits = (await get(`https://api.discogs.com/database/search?type=release&per_page=10&barcode=${code}`)).results || [];
  const dc = hits.find(r => r.format?.includes('Vinyl')) || hits[0]; // prefer the LP if a CD shares the barcode
  // Deezer only knows digital-release UPCs, but when it matches it's exact.
  try { const a = await dz(`/album/upc:${upc}`); $('msg').textContent = ''; return showAlbum(a.id, dc?.uri); } catch {}
  // Otherwise artist + title → normal search, MusicBrainz as fallback.
  // Discogs: "Nirvana (2) - Nevermind", "Artist*" → strip disambiguation marks
  let q = dc?.title.replace(/ \(\d+\)|\*/g, '').replace(' - ', ' ');
  if (!q) {
    const mb = (await get(`https://musicbrainz.org/ws/2/release/?fmt=json&limit=1&query=${encodeURIComponent(`barcode:${code} OR barcode:${upc}`)}`)).releases?.[0];
    q = mb && `${mb['artist-credit'][0].name} ${mb.title}`;
  }
  if (!q) return $('msg').textContent = `Viivakoodia ${code} ei tunnistettu, kirjoita nimi käsin.`;
  $('q').value = q;
  search(q, dc?.uri);
}

// --- Saved records, in this browser only.
// ponytail: localStorage; iOS Safari can wipe it after ~7 days unused unless the page is added to the home screen. Export/sync if that bites.
const load = () => { try { return JSON.parse(localStorage.lpSaved || '[]'); } catch { return []; } };
function store(list) {
  try { localStorage.lpSaved = JSON.stringify(list); } catch { alert('Tallennus epäonnistui (yksityinen selaus?)'); }
  $('savedN').textContent = list.length || '';
}
store(load());

async function saveAlbum(a) {
  const price = prompt(`Hinta kaupassa (€): ${a.artist.name} – ${a.title}`, '');
  if (price === null) return;
  const btn = $('save'), discogs = $('discogs');
  btn.disabled = true; btn.textContent = 'Haetaan sijaintia…';
  const pos = await new Promise(ok => navigator.geolocation
    ? navigator.geolocation.getCurrentPosition(p => ok(p.coords), () => ok(null), { timeout: 10000, maximumAge: 60000 })
    : ok(null));
  const list = load();
  list.unshift({ id: a.id, title: a.title, artist: a.artist.name, cover: a.cover_medium, price: price.replace(/[€\s]/g, ''),
    discogs: discogs.href, lat: pos?.latitude, lng: pos?.longitude, date: new Date().toISOString() });
  store(list);
  btn.textContent = pos ? '✓ Tallennettu' : '✓ Tallennettu (ilman sijaintia)';
}

$('savedBtn').onclick = showSaved;
function showSaved() {
  const list = load();
  player.pause(); cur = -1; $('hits').innerHTML = '';
  $('msg').textContent = list.length ? '' : 'Ei tallennettuja levyjä.';
  $('album').innerHTML = `<h2>Tallennetut levyt</h2><ul class="saved">${list.map((r, i) => `<li data-i="${i}">
    <img src="${r.cover}"><span class="t"><b>${esc(r.title)}</b><br><small>${esc(r.artist)}${r.price ? ` · ${esc(r.price)} €` : ''} · ${new Date(r.date).toLocaleDateString('fi-FI')}</small></span>
    ${r.lat != null ? `<a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" aria-label="Sijainti kartalla">📍</a>` : ''}
    <button data-del="${i}" aria-label="Poista">✕</button></li>`).join('')}</ul>`;
  $('album').querySelector('ul').onclick = e => {
    if (e.target.closest('a')) return;
    if (e.target.dataset.del != null) {
      if (confirm('Poistetaanko levy listalta?')) { list.splice(+e.target.dataset.del, 1); store(list); showSaved(); }
      return;
    }
    const li = e.target.closest('li');
    if (li) showAlbum(list[li.dataset.i].id);
  };
}

// ?q=rumours opens a search directly (shareable link).
const q0 = new URLSearchParams(location.search).get('q');
if (q0) { $('q').value = q0; search(q0); }

$('hits').onclick = e => e.target.dataset.id && showAlbum(e.target.dataset.id);

async function showAlbum(id, release) {
  for (const img of $('hits').children) img.classList.toggle('on', img.dataset.id == id);
  player.pause(); cur = -1;
  const a = await dz(`/album/${id}`);
  tracks = a.tracks.data.filter(t => t.preview);
  const spotify = 'https://open.spotify.com/search/' + encodeURIComponent(`${a.artist.name} ${a.title}`);
  const title = a.title.replace(/\s*[([].*$/, ''); // "Rumours (Super Deluxe)" → "Rumours"
  const discogs = 'https://www.discogs.com' + (release || '/search/?type=all&q=' + encodeURIComponent(`${a.artist.name} ${title}`));
  $('album').innerHTML = `
    <div class="head"><img src="${a.cover_big}"><div>
      <h2>${esc(a.title)}</h2><p>${esc(a.artist.name)} · ${a.release_date?.slice(0, 4) || ''} · ${a.nb_tracks} kpl</p>
      <div class="acts"><a href="${spotify}" target="_blank">Spotify ↗</a><a id="discogs" href="${discogs}" target="_blank">Discogs (hinnat) ↗</a><button id="save">💾 Tallenna</button></div></div></div>
    <ol>${tracks.map((t, i) => `<li data-i="${i}"><span class="n">${i + 1}</span><span class="t">${esc(t.title)}</span><span class="d">${mmss(t.duration)}</span></li>`).join('')}</ol>`;
  $('album').querySelector('ol').onclick = e => { const li = e.target.closest('li'); li && play(+li.dataset.i); };
  $('save').onclick = () => saveAlbum(a);
  // No scanned pressing: link the master page (all pressings + marketplace) instead of a search, if Discogs finds one.
  const link = $('discogs'); // grab now: a newer album may replace it while we wait
  if (!release) {
    const m = (await get(`https://api.discogs.com/database/search?type=master&per_page=1&artist=${encodeURIComponent(a.artist.name)}&release_title=${encodeURIComponent(title)}`)).results?.[0];
    if (m) link.href = 'https://www.discogs.com' + m.uri;
  } else {
    // Price only for the exact scanned pressing; a master's lowest price mixes in CDs etc. and misleads.
    const st = await get(`https://api.discogs.com/marketplace/stats/${release.match(/\d+/)[0]}?curr_abbr=EUR`);
    if (st.num_for_sale != null) link.textContent = st.lowest_price
      ? `Discogs: ${st.num_for_sale} myynnissä, alkaen ${st.lowest_price.value.toLocaleString('fi-FI', { style: 'currency', currency: st.lowest_price.currency })} ↗`
      : 'Discogs: ei myynnissä ↗';
  }
}

function play(i) {
  if (i === cur && !player.paused) { player.pause(); return; }
  if (i !== cur) { cur = i; player.src = tracks[i].preview; }
  player.play();
  document.querySelectorAll('li').forEach(li => li.classList.toggle('on', +li.dataset.i === i));
}
// Auto-advance: whole album as a 30 s/track sampler.
player.onended = () => cur + 1 < tracks.length && play(cur + 1);
</script>
</body>
</html>
